<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星穹铁道跃迁记录</title>
    <link rel="stylesheet" href="{{cssUrl}}">
    <style>
      :root {
        --page-bg: #090b19;
        --surface: radial-gradient(circle at 88% 3%, rgba(131, 96, 245, 0.3), transparent 28%), linear-gradient(180deg, #11152b, #090b17);
        --text: #dce5ff;
        --heading: #f3f5ff;
        --muted: #919bbd;
        --header-text: #ffffff;
        --muted-on-header: #b8c5e7;
        --header-bg: linear-gradient(125deg, #1c2650, #292351 62%, #6b4385);
        --header-border: rgba(133, 185, 255, 0.42);
        --emblem-bg: rgba(106, 185, 255, 0.12);
        --emblem-radius: 12px 36px 12px 36px;
        --chip-bg: rgba(124, 174, 255, 0.1);
        --chip-border: rgba(124, 174, 255, 0.32);
        --luck-bg: rgba(7, 11, 31, 0.55);
        --card-bg: rgba(25, 30, 58, 0.94);
        --section-bg: rgba(17, 21, 43, 0.92);
        --highlight-bg: linear-gradient(145deg, rgba(40, 46, 85, 0.96), rgba(42, 28, 70, 0.96));
        --highlight-border: #6d64aa;
        --line: #343b68;
        --line-soft: #2a3158;
        --track: #262d50;
        --accent: #79bfff;
        --accent-strong: #f2c76d;
        --pity-gradient: linear-gradient(90deg, #52c6ff, #9b72ff, #f4c96c);
        --row-alt: #141a35;
        --table-head-bg: #29315e;
        --table-head-text: #f4f7ff;
        --footer-bg: #20284f;
        --footer-text: #c4d0f1;
        --display-font: "Microsoft YaHei", "PingFang SC", sans-serif;
        --radius-large: 20px;
        --radius-medium: 14px;
        --radius-small: 10px;
        --shadow: 0 22px 50px rgba(0, 0, 0, 0.38);
        --card-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      }

      #container::before {
        top: 40px;
        left: -120px;
        width: 720px;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(121, 191, 255, 0.8), transparent);
        box-shadow: 120px 110px 0 rgba(151, 113, 255, 0.3), 320px 260px 0 rgba(121, 191, 255, 0.22);
        transform: rotate(-16deg);
      }

      #container::after {
        top: 0;
        right: 0;
        width: 420px;
        height: 420px;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.65) 0 1px, transparent 1.7px);
        background-size: 36px 36px;
        opacity: 0.22;
        mask-image: linear-gradient(135deg, #000, transparent 70%);
      }

      .record-title {
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }

      .pool-card {
        border-left-width: 2px;
        box-shadow: inset 0 0 20px rgba(102, 132, 255, 0.04);
      }
    </style>
  </head>
  <body class="theme-starrail">
    <main id="container"></main>
    <script id="record-data" type="application/json">{{@ viewJson}}</script>
    <script src="{{scriptUrl}}"></script>
  </body>
</html>
